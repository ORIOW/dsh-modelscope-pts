# dsh-modelscope-pts 的 bundle 补丁：把插件挂进 profile。
# 出现在 profile 的 dsh.profile.bundles 列表时生效。
# 两条 insert 入口（每条一张组件卡，在插件页各自独立启停）：
#   - modelscope-pts        魔粒余额：host 半身拉取余额并挂 RPC 通道，浏览器半身注册
#                           插件行配置页（plugins.row.config）与模型选择行徽章。
#   - modelscope-magicube   每日魔粒互动：定时点赞任务 + 组件卡设置/状态
#                           （子路径插件 dsh-modelscope-pts/magicube，见 lib/magicube.js）。
# ⚠️ id 一经发布即永久稳定：组件被用户停用后，profile 用户补丁层会持久保留
#    `- id: <insert id>` + disabled 行（跨插件升级不清除）；改 id 会让旧开关失配。

- insert:
    - id: modelscope-pts
      name: dsh-modelscope-pts
    - id: modelscope-magicube
      name: dsh-modelscope-pts/magicube
